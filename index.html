
<!DOCTYPE html>
<html lang="zh-TW" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- CHANGED: Added maximum-scale=1.0, user-scalable=no to prevent iOS zooming on input focus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GPick代購</title>
    <!-- 分享連結到 LINE/社群時，這幾個標籤決定預覽卡片顯示什麼。故意不設 og:image——
         沒有圖片，LINE 就只會顯示純文字卡片（標題+說明），不會有任何縮圖。
         同時把 favicon 換成一張很小的素色圖（32x32），因為沒有 og:image 時，有些平台的
         爬蟲會退而求其次抓網站圖示當縮圖；圖示夠小，大部分爬蟲就不會把它當成縮圖候選，
         這樣才能真正保證不會跳出圖片。等 logo 做好了，這裡的 favicon 可以直接換成正式版。 -->
    <meta property="og:title" content="GPick代購" />
    <meta property="og:description" content="日本代購／海外連線購物，瀏覽商品、追蹤訂單進度" />
    <link rel="icon" type="image/png" href="https://gpick-cloud.web.app/favicon-small.png" />
    <link rel="apple-touch-icon" href="/gpick-logo.png" />
    <!-- CHANGED: Use absolute path /manifest.json to fix Vercel PWA 404 issues -->
    <link rel="manifest" href="/manifest.json?v=101" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
